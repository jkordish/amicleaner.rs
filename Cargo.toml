[package]
name = "amicleaner"
version = "2.0.0"
authors = ["Joseph Kordish <joe@unicornclouds.com>"]
edition = "2024"
rust-version = "1.93.1"
readme = "README.md"
license = "MIT"
autobins = false

[[bin]]
name = "amicleaner"
path = "./src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-autoscaling = { version = "1.121.0" }
aws-sdk-backup = { version = "1.114.0" }
aws-sdk-batch = { version = "1.118.0" }
aws-sdk-cloudformation = { version = "1.117.0" }
aws-sdk-ec2 = { version = "1.237.0" }
aws-sdk-emr = { version = "1.114.0" }
aws-sdk-imagebuilder = { version = "1.117.0" }
aws-sdk-ssm = { version = "1.114.0" }
aws-types = { version = "1.3.16" }
chrono = { version = "0.4.45" }
clap = { version = "4.6.7", features = ["derive"] }
log = { version = "0.4.34" }
simple_logger = { version = "5.2.0", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["full"] }

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"         # larger binaries but better optimized
opt-level = 3
strip = "symbols"

[profile.release.package."*"]
codegen-units = 1
incremental = false
opt-level = 3

[dev-dependencies]
# test-util enables the mock_client! macro from aws-smithy-mocks.
aws-sdk-autoscaling = { version = "1.121.0", features = ["test-util"] }
aws-sdk-backup = { version = "1.114.0", features = ["test-util"] }
aws-sdk-batch = { version = "1.118.0", features = ["test-util"] }
aws-sdk-cloudformation = { version = "1.117.0", features = ["test-util"] }
aws-sdk-ec2 = { version = "1.237.0", features = ["test-util"] }
aws-sdk-emr = { version = "1.114.0", features = ["test-util"] }
aws-sdk-imagebuilder = { version = "1.117.0", features = ["test-util"] }
aws-sdk-ssm = { version = "1.114.0", features = ["test-util"] }
aws-smithy-mocks = "0.2.6"
